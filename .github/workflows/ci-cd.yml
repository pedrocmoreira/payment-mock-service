# Pipeline independente do payment-mock-service: build -> testes -> qualidade -> imagem -> deploy Kubernetes
name: CI/CD payment-mock-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE: payment-mock-service
  IMAGE: ghcr.io/${{ github.repository_owner }}/payment-mock-service

jobs:
  build-test:
    name: Build e testes (cobertura mínima 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + testes unitários/BDD + JaCoCo check (>= 80%)
        run: ./mvnw -B verify
      - name: Resumo de cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = 'target/site/jacoco/jacoco.csv'
          if os.path.exists(path):
              rows = list(csv.DictReader(open(path)))
              missed = sum(int(r['LINE_MISSED']) for r in rows)
              covered = sum(int(r['LINE_COVERED']) for r in rows)
              print(f"### Cobertura de linhas: {100 * covered / (missed + covered):.1f}%")
          PY
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/


  quality:
    name: Qualidade (SonarCloud)
    runs-on: ubuntu-latest
    needs: build-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Análise SonarCloud + Quality Gate
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
      - name: Aviso - SONAR_TOKEN ausente
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::Configure o secret SONAR_TOKEN (SonarCloud > My Account > Security)"
          exit 1

  docker:
    name: Imagem Docker (GHCR)
    runs-on: ubuntu-latest
    needs: [build-test, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Checkout da infraestrutura compartilhada
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/garage-infra
          path: infra
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Cluster real (quando o secret KUBE_CONFIG estiver configurado) ----------
      - name: Configurar kubeconfig do cluster
        id: cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
            echo "target=remote" >> "$GITHUB_OUTPUT"
          else
            echo "target=kind" >> "$GITHUB_OUTPUT"
          fi

      # ---------- Sem cluster remoto: deploy efêmero em kind para validar os manifestos ----------
      - name: Criar cluster kind
        if: steps.cluster.outputs.target == 'kind'
        uses: helm/kind-action@v1
        with:
          cluster_name: garage
      - name: Gerar secrets efêmeros (kind)
        if: steps.cluster.outputs.target == 'kind'
        run: |
          cp infra/.env.example infra/.env
          sed -i "s/troque-esta-senha/$(openssl rand -hex 12)/g" infra/.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" infra/.env
      - name: Carregar imagem no kind
        if: steps.cluster.outputs.target == 'kind'
        run: |
          docker pull "$IMAGE:${{ github.sha }}"
          kind load docker-image "$IMAGE:${{ github.sha }}" --name garage

      - name: Aplicar namespace, secrets e dependências
        run: |
          kubectl apply -f infra/k8s/infra/00-namespace.yaml
          if [ "${{ steps.cluster.outputs.target }}" = "kind" ]; then ./infra/scripts/create-secrets.sh infra/.env; fi
          kubectl apply -f infra/k8s/observability/otel-collector.yaml
      - name: Deploy do payment-mock-service
        run: |
          kubectl apply -f k8s/
          kubectl -n garage set image deployment/payment-mock-service "payment-mock-service=$IMAGE:${{ github.sha }}"
          kubectl -n garage annotate deployment/payment-mock-service kubernetes.io/change-cause="${{ github.sha }}" --overwrite
      - name: Aguardar rollout
        run: |
          kubectl -n garage rollout status deployment/payment-mock-service --timeout=420s
      - name: Smoke test (health check)
        run: |
          kubectl -n garage port-forward svc/payment-mock-service 18080:80 &
          sleep 5
          curl -fsS http://localhost:18080/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl -n garage get pods -o wide
          kubectl -n garage describe deployment/payment-mock-service
          kubectl -n garage logs deployment/payment-mock-service --tail=200 || true
